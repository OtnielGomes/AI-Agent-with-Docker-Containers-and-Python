services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    environment:
      - PORT=8000
      - MY_PROJECT=Hello World
    env_file:
      - .env
    volumes:
      - ./api/src:/app
    depends_on:
      - db_service
    develop:
      watch:
        - action: rebuild
          path: api/requirements.txt
        - action: rebuild
          path: api/Dockerfile
        - action: restart
          path: api/src/

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:8080
      - WATCHPACK_POLLING=true
    depends_on:
      - api
    develop:
      watch:
        - action: rebuild
          path: web/package.json
        - action: rebuild
          path: web/package-lock.json
        - action: rebuild
          path: web/Dockerfile
        - action: sync+restart
          path: web/
          target: /app
          ignore:
            - node_modules/
            - .next/

  db_service:
    image: postgres:17.5
    ports:
      - 5432:5432
    volumes:
      - dc_manage_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=db-password
      - POSTGRES_DB=mydb

volumes:
  dc_manage_db_data:
