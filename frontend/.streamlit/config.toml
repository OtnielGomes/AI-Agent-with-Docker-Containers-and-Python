# Required when Streamlit runs behind a reverse proxy (e.g. DigitalOcean App Platform).
# Without these settings the app may stay on the loading skeleton forever.
[server]
headless = true
port = 8501
address = "0.0.0.0"
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
